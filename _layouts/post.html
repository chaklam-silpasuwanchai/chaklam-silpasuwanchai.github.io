<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title | escape }} — Chaklam Silpasuwanchai</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>

<body>
    <div class="site">
        <header>
            <h1>{{ page.title | escape }}</h1>
            <div class="subtitle">{{ page.date | date: "%d %B %Y" }}{% if page.category %} · {{ page.category }}{% endif
                %}</div>
        </header>
        <nav aria-label="Breadcrumb"><a href="{{ '/' | relative_url }}">Home</a> <span aria-hidden="true">›</span> <a
                href="{{ '/blog.html' | relative_url }}">Blog</a> <span aria-hidden="true">›</span> <span
                aria-current="page">{{ page.title | escape }}</span></nav>
        <main class="main standalone blog-article">{{ content }}</main>
        <footer>Chaklam Silpasuwanchai</footer>
    </div>
</body>

</html>
